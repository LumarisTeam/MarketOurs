name: '🐛 Bug 反馈'
description: '报告一个 Bug，帮助我们改进'
title: '[Bug] '
labels: ['bug']
type: Bug
body:
  - type: markdown
    attributes:
      value: |
        感谢你花时间反馈问题！请尽量把信息填完整，信息越全定位越快。
        提交前请先搜索一下 [已有 Issue](https://github.com/lijiajunply/MarketOurs/issues)，避免重复。

  - type: dropdown
    attributes:
      label: '📱 客户端类型'
      description: '你在哪个端遇到的这个问题？'
      multiple: true
      options:
        - 'Web 端（桌面浏览器）'
        - 'Web 端（手机浏览器）'
        - '移动端 App（Flutter）'
        - '管理后台'
        - 'API / 服务端'
        - '其他'
    validations:
      required: true

  - type: dropdown
    attributes:
      label: '💻 操作系统'
      multiple: true
      options:
        - 'Windows'
        - 'macOS'
        - 'Ubuntu'
        - '其他 Linux'
        - 'iOS'
        - 'Android'
        - 'HarmonyOS'
        - '其他'
    validations:
      required: true

  - type: dropdown
    attributes:
      label: '📦 部署方式'
      description: '仅当问题与后端 / API 相关时必填'
      multiple: true
      options:
        - '官方线上环境'
        - 'Zeabur'
        - 'Docker 自部署'
        - '本地开发环境（SQLite）'
        - '本地开发环境（PostgreSQL）'
        - '其他'
    validations:
      required: false

  - type: input
    attributes:
      label: '📌 版本号'
      description: '如果知道的话，填写 Git commit hash 或 App / API 版本号'
      placeholder: '例如 fdb261a 或 1.0.0'
    validations:
      required: true

  - type: dropdown
    attributes:
      label: '🌐 浏览器'
      description: '非 Web 端问题可以跳过'
      multiple: true
      options:
        - 'Chrome'
        - 'Edge'
        - 'Safari'
        - 'Firefox'
        - '其他'
    validations:
      required: false

  - type: textarea
    attributes:
      label: '🐛 问题描述'
      description: 清晰地描述你遇到的问题。如果上面的选项你选了「其他」，请在这里补充说明。
      placeholder: 我做了什么，结果发生了什么……
    validations:
      required: true

  - type: textarea
    attributes:
      label: '📷 复现步骤'
      description: 一步一步写清楚怎么复现，能稳定复现的问题修复起来最快。
      placeholder: |
        1. 打开……
        2. 点击……
        3. 看到……
    validations:
      required: true

  - type: textarea
    attributes:
      label: '🚦 预期行为'
      description: 你期望它应该是什么表现？
    validations:
      required: false

  - type: textarea
    attributes:
      label: '📝 补充信息'
      description: |
        其他有助于定位的信息：报错日志、截图 / 录屏、网络请求等。
        提示：粘贴大段日志或代码时，请用 ``` 包裹起来。
    validations:
      required: false

  - type: dropdown
    attributes:
      label: '🛠️ 是否愿意提交 PR 修复？'
      options:
        - '愿意，我可以提交 PR'
        - '不愿意，但我可以帮忙测试修复效果'
    validations:
      required: false

  - type: checkboxes
    attributes:
      label: '✅ 提交前确认'
      description: 请确认以下事项，否则 Issue 可能会被直接关闭。
      options:
        - label: 我已经搜索过 [已有 Issue](https://github.com/lijiajunply/MarketOurs/issues)，确认没有重复。
          required: true
        - label: 我使用的是最新代码 / 最新版本，问题依然存在。
          required: true
        - label: 这是一个可以复现的具体 Bug，而不是使用咨询或功能建议。
          required: true
        - label: 这个问题属于 MarketOurs 本身，而不是第三方库或平台的问题。
          required: true
